<!DOCTYPE html>
<html lang="vi">
<head>             
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sở thích</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }
        .hobbies-list {
            list-style-type: none;
            padding: 0;
        }
        .hobby-item {
            background-color: #e0f7fa;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .hobby-item:hover {
            background-color: #b2ebf2;
        }
    </style>
</head>
<body>
    <div class="container">
    <h1>DANH SÁCH SỞ THÍCH</h1>
    
    <ul class="hobbies-list">
        <li class="hobby-item">Đọc sách</li>
        <li class="hobby-item">Chơi thể thao</li>
        <li class="hobby-item">Nghe nhạc</li>
        <li class="hobby-item">Du lịch</li>
        <li class="hobby-item">Lập trình</li>
    </ul>
    </div>
</body>
</html>

<!DOCTYPE html>

<head>

    <title>Sử dụng thuộc tính rowspan</title>

                <th>STT</th>

                <td><button>Xoa</button></td>
                <td rowspan="4"><button>Xoá tất cả</button> </td>
            </tr>
            <tr>
                <td>2</td>

                <td><button>Xoá</button></td>
            </tr>
            <tr>
                <td>3</td>
                <td>Phạm Thị C</td>

                <td>phamthic@gmail.com</td>
                <td>Hoạt động</td>
                <td><button>Sửa</button></td>
                <td><button>Xoá</button></td>
            </tr>
            <tr>
                <td>4</td>
                <td>Phạm Văn D</td>
                <td>20</td>

                <td>Không Hoạt động</td>
                <td><button>Sửa</button></td>
                <td><button>Xoá</button></td>
            </tr>
        </tbody>
    </table>
</body>
</html>

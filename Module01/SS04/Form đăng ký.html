<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký tài khoản</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background: fixed;
            background-color: #fff;
            justify-content: center;
            align-items: center;
        }
        .register-container {
            width: 450px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .register-container:hover {
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        .register-container h2 {
            text-align: center;
            margin-bottom: 20px;
            
        }
        .form-group {
            margin-bottom: 15px;

        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .radio-group {
            display: flex;
            gap: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            margin-right: 5px;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #af4c4c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #8b3a3a;
        }

    </style>
</head>
<body>
    <div class="register-container">
        <h2>Đăng Ký Tài Khoản</h2>
        <form>
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Giới tính:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Nam</label>
                    <label><input type="radio" name="gender" value="female"> Nữ</label>
                    <label><input type="radio" name="gender" value="other"> Khác</label>
                </div>
            </div>
            <div class="form-group">
                <label>Thành phố:</label>
                <select class="form-control">
                    <option>Hà Nội</option>
                    <option>Hồ Chí Minh</option>
                    <option>Đà Nẵng</option>
                </select>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">Tôi đồng ý với các điều khoản sử dụng</label>
            </div>
            <button type="submit" class="btn-submit">Đăng ký ngay</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh thiếp cá nhân</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-card {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .profile-card:hover {
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        .profile-image {
            width: 200px;
            height: 200px;
            border: 2px solid #6be6fc;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .profile-title {
            font-size: 18px;
            color: #555;
        }
        .profile-bio {
            font-size: 14px;
            color: #777;
            margin-bottom: 15px;
        }
        .profile-social a {
            text-decoration: none;
            color: #c21114;
            margin: 0 5px;
        }
        .profile-social a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <img src="https://jbagy.me/wp-content/uploads/2025/03/hinh-anh-avatar-anime-chibi-boy-1.jpg" alt="Ảnh đại diện" class="profile-image">
        <h2>Lê Xuân Sơn</h2>
        <p class="profile-title">Front-End Developer</p>
        <p class="profile-bio">Đam mê thiết kế giao diện web hiện đại, tối ưu trải nghiệm người dùng.</p>
        <div class="profile-social">
            <a href="https://www.facebook.com" target="_blank">Facebook</a>
            <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://www.github.com" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
